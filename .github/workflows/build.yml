name: Compilar Hold It
on:
  push:
    branches: [main]
    paths-ignore:
      - 'bolitas/**'
      - '.github/workflows/bolitas.yml'
      - 'tienda/**'
      - '.github/workflows/tienda.yml'
      - 'catalogo/**'
      - 'catalogo.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
      - name: Mostrar errores
        if: failure()
        run: grep -E "error:" build.log | head -25 | sed 's/^/::error::/' || true
      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${GITHUB_RUN_NUMBER}" dist/HoldIt.zip dist/HoldIt.tar.gz --title "Hold It 2.${GITHUB_RUN_NUMBER}" --notes "Build automática"
      - name: Enlace fijo de descarga (…/releases/download/hold-it/…zip, lo usa magnusson.casa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hold-it >/dev/null 2>&1 || gh release create hold-it --title "Descarga para la familia (hold-it)" --notes "Enlace fijo de descarga. Se actualiza con cada versión." --latest=false
          gh release upload hold-it dist/HoldIt.zip --clobber
